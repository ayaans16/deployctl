[project]
name = "deployctl"
version = "0.1.0"
dependencies = ["pyhocon", "paramiko", "python-dotenv"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4"]

[project.scripts]
deployctl = "app.cli:main"

[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]
